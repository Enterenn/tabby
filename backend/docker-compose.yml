services:
  api:
    build: .
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://tabby:${POSTGRES_PASSWORD}@db:5432/tabby
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      DEBUG: ${DEBUG:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase.json
    volumes:
      - ./firebase.json:/run/secrets/firebase.json:ro
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tabby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tabby
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabby -d tabby"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
